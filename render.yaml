services:
  - type: web
    name: kingdom-rebellion
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.20.2
      - key: AI_MODEL_PATH
        value: models/strategy-v10-robust2.json
